name: Autotests

on:
  push:
    branches: [ master, '*' ]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  multios:
    strategy:
      matrix:
        node-version: [18.x, 22.x, 24.x, 26.x]
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Autotest
        run: npm run test
        env:
          CI: true

      - name: Check master files
        if: matrix.platform == 'ubuntu-latest' && matrix.node-version == '24.x'
        run: npm run test:masters

  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 26.5.0
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: npm

      - run: npm ci

      - name: Build and check package
        run: npm run sea
